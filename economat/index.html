<script>
/* Bandeau de diagnostic : affiche les erreurs JS sans bloquer l'écran (utile sur iPhone). */
(function(){
  function bandeau(msg){
    try{
      var b=document.getElementById('diag-bandeau');
      if(!b){
        b=document.createElement('div'); b.id='diag-bandeau';
        b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#B23A2E;color:#fff;font:12px/1.4 system-ui;padding:8px 34px 8px 12px;pointer-events:none;word-break:break-word;';
        var x=document.createElement('button'); x.textContent='×';
        x.style.cssText='position:absolute;right:6px;top:0;background:none;border:0;color:#fff;font-size:18px;pointer-events:auto;cursor:pointer;padding:8px 12px;';
        x.onclick=function(){ b.remove(); };
        b.appendChild(x); document.body.appendChild(b);
      }
      var d=document.createElement('div'); d.textContent=msg; b.appendChild(d);
    }catch(e){}
  }
  window.addEventListener('error',function(e){ bandeau('Erreur : '+(e.message||e.type)+(e.filename?' — ligne '+e.lineno:'')); });
  window.addEventListener('unhandledrejection',function(e){ bandeau('Promesse rejetée : '+String(e.reason&&e.reason.message||e.reason)); });
})();
</script>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 100% -5%,#F7ECD6,rgba(247,236,214,0) 60%),var(--paper);color:var(--ink);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));touch-action:manipulation}
:root{--paper:#FAF4EA;--panel:#F3EAD9;--card:#FFFDF8;--ink:#241C16;--soft:#7A6B5A;--line:#E7DAC4;
  --saf:#C2570F;--safd:#9C440B;--bleu:#1F6FB2;--bleud:#16537F;--green:#2F7D5B;--red:#B23A2E;
  --grid:#EFE5D2;--vgood:#E6F1EB;--vbad:#F7E6E3;--vwarn:#FCE9D6}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{text-wrap:balance}

/* ---- entête ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(150deg,var(--saf),var(--safd));color:#fff;display:grid;place-items:center;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:22px;box-shadow:0 6px 16px rgba(156,68,11,.28)}
.brand h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0;line-height:1.05;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;color:var(--soft);font-size:12.5px}
.verchip{font-size:11px;font-weight:600;color:var(--saf);background:var(--vwarn);border:1px solid #F1C99E;border-radius:999px;padding:2px 9px;white-space:nowrap}

/* ---- navigation : barre d'onglets en bas (pouce iPhone) + sous-onglets ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;gap:2px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(36,28,22,.07);padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-right))}
.tb{appearance:none;border:0;background:transparent;cursor:pointer;flex:1 1 0;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Work Sans',system-ui,sans-serif;font-size:10.5px;font-weight:600;color:var(--soft);padding:3px 2px;border-radius:12px;touch-action:manipulation;position:relative;white-space:nowrap}
.tb .ico{font-size:21px;line-height:1;position:relative;filter:grayscale(1) opacity(.62);transition:filter .15s}
.tb.on{color:var(--saf)}
.tb.on .ico{filter:none}
.tb .pastille{position:absolute;top:0;left:calc(50% + 7px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;border:2px solid var(--card);z-index:1}
.seg{position:sticky;top:0;z-index:25;display:flex;gap:6px;background:linear-gradient(var(--paper) 78%,rgba(250,244,234,0));padding:8px 0 12px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;flex:1 1 auto;min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:inherit;font-weight:600;font-size:13px;color:var(--soft);padding:8px 10px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.seg button.on{background:var(--saf);border-color:var(--saf);color:#fff;box-shadow:0 3px 8px rgba(194,87,15,.25)}
.seg button .segn{display:inline-block;margin-left:6px;background:var(--vbad);color:var(--red);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.seg button.on .segn{background:rgba(255,255,255,.28);color:#fff}
#vue{margin-top:14px}
.wrap{padding-bottom:calc(88px + env(safe-area-inset-bottom))}

/* ---- cartes & structure ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 0 rgba(36,28,22,.03)}
.card+.card,.catgrp+.card,.card+.catgrp{margin-top:14px}
.h{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;margin:0 0 4px}
.sub{color:var(--soft);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.soft{color:var(--soft)}
.row{display:flex;align-items:center;gap:10px}
.empty{text-align:center;color:var(--soft);padding:26px 10px;font-size:14px}
.note{background:#FBF2DF;border:1px solid #ECD9B2;color:#6b5320;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5}

/* ---- champs & boutons ---- */

.btn{appearance:none;cursor:pointer;font-weight:600;font-size:13.5px;border-radius:9px;padding:10px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:border-color .15s,background .15s;font-family:'Work Sans',system-ui,sans-serif;min-height:40px}
.btn:hover{border-color:var(--saf)}
.btn:focus-visible,.tb:focus-visible,.seg button:focus-visible,.pill:focus-visible{outline:2px solid var(--saf);outline-offset:2px}
.btn-p{background:var(--saf);border-color:var(--saf);color:#fff}.btn-p:hover{background:var(--safd);border-color:var(--safd)}
.btn-d{color:var(--red);border-color:#EAD3CF}.btn-d:hover{background:var(--vbad);border-color:var(--red)}
.btn-sm{padding:7px 11px;font-size:12.5px;min-height:36px}
.btn[disabled]{opacity:.5;cursor:default}
.pills{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.pill{appearance:none;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--soft);padding:8px 13px;border-radius:8px;font-family:'Work Sans',system-ui,sans-serif;min-height:36px}
.pill.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(36,28,22,.08)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none;min-height:36px}
.chk input{width:17px;height:17px;accent-color:var(--saf)}
.tag{font-size:11px;color:var(--soft)}
.chipf{appearance:none;border:1px solid #F1C99E;background:var(--vwarn);color:var(--safd);font-weight:600;font-size:12.5px;border-radius:999px;padding:8px 13px;cursor:pointer;font-family:'Work Sans',system-ui,sans-serif;white-space:nowrap;min-height:36px}
.chipf.off{background:#fff;border-color:var(--line);color:var(--soft)}

/* ---- tableaux ---- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #F1E7D5;font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.catrow td{background:var(--panel);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8A5A2B;padding:7px 8px}
.rowf{border-left:3px solid #E9A86A}

/* ---- indicateurs ---- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:721px){.kpis{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .l{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .v{font-family:'Work Sans',system-ui,sans-serif;font-size:21px;font-weight:600;margin-top:3px}
.stat .u{font-size:12px;color:var(--soft);font-weight:500}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.liaison-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:2px;color:var(--ink);background:var(--panel);border:1px dashed var(--saf);border-radius:10px;padding:10px 14px;text-align:center;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.b-good{background:var(--vgood);color:var(--green)}.b-bad{background:var(--vbad);color:var(--red)}.b-warn{background:var(--vwarn);color:var(--safd)}
.flagb{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--safd);background:var(--vwarn);border:1px solid #F1C99E;border-radius:6px;padding:1px 7px;white-space:nowrap}
.vbtn{appearance:none;font-size:11px;font-weight:600;color:#0a7d33;background:#E8F6EC;border:1px solid #B8E2C4;border-radius:6px;padding:8px 12px;min-height:36px;cursor:pointer;font-family:'Work Sans',system-ui,sans-serif}
.vbtn:hover{background:#d8efe0}
.msub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--soft);margin-top:3px}
.foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.foot .l{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.03em}
.foot .v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}

/* ---- recettes ---- */
.line{display:grid;grid-template-columns:1fr 92px 50px 36px;gap:8px;align-items:center}
.lines{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.catgrp{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.catgrp>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-family:'Fraunces',Georgia,serif;font-size:16px;color:var(--ink)}
.catgrp>summary::-webkit-details-marker{display:none}
.catgrp>summary .cnt{font-family:'Work Sans',system-ui,sans-serif;font-weight:600;font-size:11px;color:var(--saf);background:#F6E7D4;border-radius:999px;padding:3px 10px;white-space:nowrap}
.catgrp>summary::after{content:"▾";color:var(--soft);font-size:12px;transition:transform .15s}
.catgrp[open]>summary::after{transform:rotate(180deg)}
.catgrp[open]>summary{border-bottom:1px solid var(--line)}
.catgrp .inner{padding:10px 12px 12px}

/* ---- accueil ---- */
.home{animation:up .5s ease both}
.hero{background:linear-gradient(180deg,#FFFDF8,#FBF3E1);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 22px 46px -30px rgba(156,68,11,.5);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;background:radial-gradient(circle,rgba(194,87,15,.12),rgba(194,87,15,0) 70%);pointer-events:none}
.kicker{font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--saf)}
.hero h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;line-height:1.08;margin:9px 0 8px;letter-spacing:-.01em}
.lede{color:var(--soft);font-size:14.5px;line-height:1.55;max-width:48ch;margin:0}
.venues{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 6px}
.venue{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 15px 19px;overflow:hidden}
.venue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,linear-gradient(var(--saf),var(--safd)))}
.venue .vn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;line-height:1}
.venue .vr{font-size:12px;color:var(--soft);margin-top:4px}
.cta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.btn-xl{font-size:15px;padding:13px 22px;border-radius:11px;box-shadow:0 12px 24px -12px rgba(194,87,15,.65)}
.btn-ghost{background:transparent;border:0;color:var(--saf);font-weight:600;font-size:13.5px;cursor:pointer;padding:10px 8px;font-family:'Work Sans',system-ui,sans-serif;min-height:40px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}
.step .sn{width:27px;height:27px;border-radius:8px;background:linear-gradient(150deg,var(--saf),var(--safd));color:#fff;display:grid;place-items:center;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:14px;margin-bottom:10px}
.step .st{font-weight:600;font-size:13.5px}
.step .sd{font-size:12px;color:var(--soft);margin-top:4px;line-height:1.45}

/* ---- graphiques ---- */
.chartwrap{position:relative;margin-top:6px}
.chartwrap svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:8px 2px 2px;font-size:12.5px;color:var(--soft)}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .swl{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.ttip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;box-shadow:0 8px 20px -8px rgba(36,28,22,.35);display:none;z-index:30;min-width:130px;line-height:1.5}
.ttip b{font-variant-numeric:tabular-nums}
.axis{font-size:10.5px;fill:var(--soft);font-family:'Work Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.gridl{stroke:var(--grid);stroke-width:1}

/* ---- menu engineering ---- */
.quad{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:721px){.quad{grid-template-columns:repeat(4,1fr)}}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel)}
.qcard .qt{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.qcard .qn{font-size:20px;font-weight:600;margin:2px 0;font-variant-numeric:tabular-nums}
.qcard .qd{font-size:11.5px;color:var(--soft);line-height:1.45}
.medot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ---- le veilleur ---- */
.valerte{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F1E7D5}
.valerte:last-child{border-bottom:0}
.vniv{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px}
.vniv.grave{background:var(--red)}.vniv.attention{background:#E09112}.vniv.info{background:#8A9BB0}
.valerte .vt{font-weight:600;font-size:14px}
.valerte .vd{font-size:12.5px;color:var(--soft);line-height:1.5;margin-top:2px}
.valerte .vabtn{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.vok{appearance:none;border:1px solid var(--line);background:#fff;color:var(--soft);font-size:11.5px;font-weight:600;border-radius:7px;padding:6px 10px;cursor:pointer;font-family:'Work Sans',system-ui,sans-serif;min-height:32px}
.vok:hover{border-color:var(--saf);color:var(--ink)}
.copi{background:linear-gradient(180deg,#FFFDF8,#FAF3E4);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.copi .ct{font-size:13.5px;line-height:1.6}
.copi .ct p{margin:0 0 8px}.copi .ct ul{margin:0 0 8px;padding-left:20px}.copi .ct li{margin-bottom:3px}

/* ---- modals ---- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(36,28,22,.45)}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:min(86vh,86dvh);overflow-y:auto;padding:20px;box-shadow:0 24px 60px -20px rgba(36,28,22,.55);animation:boxIn .22s ease both}
.mbox .mtitle{display:inline-block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;background:var(--vwarn);color:var(--safd);border-radius:999px;padding:6px 16px;margin:0 0 12px}
.mbox .mtitle.rouge{background:var(--vbad);color:var(--red)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ---- toasts ---- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(94vw,440px)}
.toast{background:var(--ink);color:#FFFDF8;border-radius:11px;padding:11px 15px;font-size:13.5px;box-shadow:0 10px 26px -8px rgba(36,28,22,.5);display:flex;align-items:center;gap:12px;animation:up .25s ease both;max-width:100%}
.toast button{appearance:none;border:0;background:none;color:#FFC98A;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 10px;min-height:36px;min-width:36px;font-family:'Work Sans',system-ui,sans-serif;white-space:nowrap}

/* ---- fiche technique / impression ---- */
.fiche h3{font-family:'Fraunces',Georgia,serif;font-size:20px;margin:0 0 2px}
.fiche .fsub{color:var(--soft);font-size:12px;margin:0 0 12px}
#print-zone{display:none}
@media print{
  body{background:#fff;padding:0}
  body.printing #app,body.printing #toasts,body.printing .modal{display:none !important}
  body.printing #print-zone{display:block;font-size:12px}
  #print-zone .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;margin-top:10px}
  #print-zone .pagebreak{break-after:page}
}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes boxIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media(max-width:720px){
  .brand h1{font-size:19px}
  .hero h2{font-size:25px}.hero{padding:22px 18px}
  .venues{grid-template-columns:1fr}.steps{grid-template-columns:1fr}
  .fld,select.fld{font-size:16px}
  .line{grid-template-columns:1fr 70px 38px 38px}
}

<body>
<div id="app" class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark">É</div>
      <div>
        <h1>Économat Pro</h1>
        <p id="brand-sub">La Vue · Rare — food cost &amp; labo</p>
      </div>
    </div>
    <span class="verchip">v4.3</span>
  </div>
  <main id="vue"></main>
  <nav class="tabbar" id="tabs" style="display:none" aria-label="Navigation principale"></nav>
  <p class="soft" id="pied" style="text-align:center;font-size:12px;margin-top:22px">Données enregistrées automatiquement sur cet appareil.</p>
</div>

<div class="modal" id="modal-confirm">
  <div class="mbox">
    <p class="mtitle rouge" id="mc-titre">Confirmer</p>
    <p id="mc-texte" style="font-size:14px;line-height:1.55;margin:0"></p>
    <div class="mrow">
      <button class="btn" id="mc-non">Annuler</button>
      <button class="btn btn-d" id="mc-oui">Confirmer</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-import">
  <div class="mbox">
    <p class="mtitle">Jours déjà importés</p>
    <p id="mi-texte" style="font-size:14px;line-height:1.55;margin:0"></p>
    <div class="mrow">
      <button class="btn" id="mi-annuler">Annuler</button>
      <button class="btn" id="mi-additionner">Additionner</button>
      <button class="btn btn-p" id="mi-remplacer">Remplacer les jours</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-fiche">
  <div class="mbox" style="max-width:620px">
    <div class="fiche" id="fiche-corps"></div>
    <div class="mrow">
      <button class="btn" id="fiche-fermer">Fermer</button>
      <button class="btn btn-p" id="fiche-imprimer">Imprimer / PDF</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="print-zone"></div>
<script>
'use strict';
/* ============================================================
   Économat Pro v4.3 — La Vue · Rare (Tanger)
   Un seul fichier. Aucune dépendance. Données sur l'appareil.
   ============================================================ */

/* ---------- aides ---------- */
const UNITS = ["g", "kg", "ml", "L", "pièce", "botte"];
const uid = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (x) => { const n = parseFloat(String(x ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const NF = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const nf = (n) => NF.format(isFinite(n) ? n : 0);
const nf1 = (n) => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 }).format(isFinite(n) ? n : 0);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const normN = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const soldAt = (d, posId) => !Array.isArray(d.posIds) || d.posIds.length === 0 || d.posIds.includes(posId);
const withKeys = (recipe) => (recipe || []).map((l) => ({ ...l }));
const debounce = (f, ms) => { let t = null; return (...a) => { if (t) clearTimeout(t); t = setTimeout(() => { t = null; f(...a); }, ms); }; };
/* pose une clé arbitraire (même « __proto__ ») comme propriété propre, sans passer par le setter du prototype */
const poserCle = (obj, cle, val) => { Object.defineProperty(obj, cle, { value: val, enumerable: true, writable: true, configurable: true }); };

const fmtLocalD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const DAY_START = 6; /* journée de travail 6h → 4h : la nuit est rattachée à la veille */
const bizDayKey = (d) => { const x = new Date(d.getTime()); x.setHours(x.getHours() - DAY_START); return fmtLocalD(x); };
const fmtD = (s) => { if (!s) return ""; const p = s.split("-"); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; };

function parseDT(dVal, tVal) {
  if (dVal instanceof Date && !isNaN(dVal)) {
    const ts = (tVal != null) ? String(tVal) : "";
    const mt = ts.match(/(\d{1,2}):(\d{2})/);
    if (mt) { const x = new Date(dVal.getTime()); x.setHours(+mt[1], +mt[2], 0, 0); return x; }
    return dVal;
  }
  const str = String(dVal || "").trim(); if (!str) return null;
  let y, mo, da, hh = 0, mi = 0;
  const ymd = str.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  const dmy = str.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (ymd) { y = +ymd[1]; mo = +ymd[2]; da = +ymd[3]; }
  else if (dmy) { da = +dmy[1]; mo = +dmy[2]; y = +dmy[3]; if (y < 100) y += 2000; }
  else { const d = new Date(str); return isNaN(d) ? null : d; }
  const tsrc = (tVal != null && String(tVal).trim()) ? String(tVal) : str;
  const mt = tsrc.match(/(\d{1,2}):(\d{2})/);
  if (mt) { hh = +mt[1]; mi = +mt[2]; }
  else { hh = 12; mi = 0; } /* date sans heure → midi : la vente reste sur le jour indiqué (journée 6 h → 4 h) */
  const d2 = new Date(y, mo - 1, da, hh, mi);
  /* aller-retour vérifié : rejette 05/26/2025 (format US) et 31/04 au lieu de déborder en silence */
  return (d2.getMonth() === mo - 1 && d2.getDate() === da) ? d2 : null;
}
const pickCol = (keys, pats) => keys.find((k) => pats.some((p) => normN(k).includes(p)));

/* ---------- moteur recettes ---------- */
const rendOf = (p) => ((p && p.fabrique ? num(p.rendement) : 1) || 1);

function explode(byId, id, mult, acc, path) {
  const p = byId[id];
  if (!p) return;
  if (p.kind === "matiere") { acc[id] = (acc[id] || 0) + mult; return; }
  if (path.includes(id)) return; /* garde anti-boucle */
  const r = rendOf(p);
  (p.recipe || []).forEach((l) => explode(byId, l.ref, (mult * num(l.qty)) / r, acc, [...path, id]));
}
function prodCounts(byId, id, mult, acc, path) {
  const p = byId[id];
  if (!p || p.kind !== "produit") return;
  if (path.includes(id)) return;
  if (p.fabrique) acc[id] = (acc[id] || 0) + mult;
  const r = rendOf(p);
  (p.recipe || []).forEach((l) => prodCounts(byId, l.ref, (mult * num(l.qty)) / r, acc, [...path, id]));
}
function unitCost(byId, id) {
  const acc = {}; explode(byId, id, 1, acc, []);
  return Object.keys(acc).reduce((s, m) => s + acc[m] * num((byId[m] || {}).cost), 0);
}
function computeForSales(byId, salesMap) {
  const mp = {}; let revenue = 0;
  Object.keys(salesMap || {}).forEach((pid) => {
    const q = num(salesMap[pid]); if (!q) return;
    const p = byId[pid]; if (!p) return;
    revenue += num(p.prix) * q;
    explode(byId, pid, q, mp, []);
  });
  let cost = 0;
  Object.keys(mp).forEach((m) => { cost += mp[m] * num((byId[m] || {}).cost); });
  return { mp, revenue, cost, margin: revenue - cost, foodCost: revenue ? (cost / revenue) * 100 : 0 };
}

/* Menu engineering (matrice popularité × marge, méthode Kasavana-Smith) */
function menuEng(byId, salesMap, produits) {
  const rows = [];
  produits.forEach((d) => {
    const q = num((salesMap || {})[d.id]); const pr = num(d.prix);
    if (!q || pr <= 0) return;
    const uc = unitCost(byId, d.id);
    rows.push({ d, q, pr, uc, cm: pr - uc, fc: pr > 0 ? (uc / pr) * 100 : 0 });
  });
  const n = rows.length;
  if (!n) return { rows: [], n: 0, totQ: 0, avgCM: 0, seuilPop: 0 };
  const totQ = rows.reduce((s, r) => s + r.q, 0);
  const avgCM = rows.reduce((s, r) => s + r.cm * r.q, 0) / (totQ || 1);
  const seuilPop = (totQ / n) * 0.7; /* règle des 70 % */
  rows.forEach((r) => {
    r.populaire = r.q >= seuilPop; r.rentable = r.cm >= avgCM;
    r.cl = r.populaire ? (r.rentable ? "etoile" : "cheval") : (r.rentable ? "enigme" : "poids");
  });
  rows.sort((a, b) => b.cm * b.q - a.cm * a.q);
  return { rows, n, totQ, avgCM, seuilPop };
}

function levenshtein(a, b) {
  a = String(a); b = String(b);
  if (a === b) return 0;
  const m = a.length, n2 = b.length;
  if (!m) return n2; if (!n2) return m;
  let prev = Array.from({ length: n2 + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n2; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }

  }

}

  produits.forEach((p) => {
    const np = normN(p.name); if (!np) return;

/* analyse complète — retourne des alertes {cle, niveau: grave|attention|info, titre, detail, actions} */
function analyserVeille() {
  const alertes = [];
  const byId = getById(), eff = effSales(), comb = combined();
  const vendus = S.produits.filter((d) => num(comb[d.id]) > 0);

  /* 1. marges négatives : on vend à perte */
  const pertes = vendus
    .map((d) => ({ d, q: num(comb[d.id]), pr: num(d.prix), uc: unitCost(byId, d.id) }))
    .filter((x) => x.pr > 0 && x.uc > x.pr)
    .sort((a, b) => (b.uc - b.pr) * b.q - (a.uc - a.pr) * a.q);
  if (pertes.length) {
    alertes.push({
      cle: "pertes:" + pertes.map((x) => x.d.id).sort().join(","),
      niveau: "grave",
      titre: `${pertes.length} produit(s) vendu(s) à perte`,
      detail: pertes.slice(0, 4).map((x) => `${x.d.name} : coût ${nf(x.uc)} MAD pour ${nf(x.pr)} MAD de prix (${nf(x.q)} vendus)`).join(" · ") + (pertes.length > 4 ? ` · et ${pertes.length - 4} autre(s)` : "") + ". Vérifie la recette ou monte le prix.",
    });
  }

  /* 2. food cost bien au-dessus de l'objectif */
  const fcHauts = vendus
    .map((d) => ({ d, q: num(comb[d.id]), pr: num(d.prix), uc: unitCost(byId, d.id) }))
    .filter((x) => x.pr > 0 && x.uc > 0 && x.uc <= x.pr && (x.uc / x.pr) * 100 > S.objectifFC + 10)
    .sort((a, b) => b.q * (b.uc - b.pr * S.objectifFC / 100) - a.q * (a.uc - a.pr * S.objectifFC / 100));
  if (fcHauts.length) {
    alertes.push({
      cle: "fchaut:" + fcHauts.length + ":" + (fcHauts[0] ? fcHauts[0].d.id : ""),
      niveau: "attention",
      titre: `${fcHauts.length} produit(s) à plus de ${nf(S.objectifFC + 10)} % de food cost`,
      detail: fcHauts.slice(0, 4).map((x) => `${x.d.name} (${nf1(x.uc / x.pr * 100)} %)`).join(" · ") + (fcHauts.length > 4 ? "…" : "") + ` — objectif ${nf(S.objectifFC)} %. Revois portion, prix ou recette.`,
    });
  }

  /* 3. produits vendus sans recette : le food cost affiché est sous-estimé */
  const sansRecette = vendus
    .filter((d) => unitCost(byId, d.id) === 0)
    .map((d) => ({ d, ca: num(comb[d.id]) * num(d.prix) }))
    .sort((a, b) => b.ca - a.ca);
  if (sansRecette.length) {
    const caManquant = sansRecette.reduce((s, x) => s + x.ca, 0);
    alertes.push({
      cle: "sansrecette:" + sansRecette.length,
      niveau: "attention",
      titre: `${sansRecette.length} produit(s) vendu(s) sans coût matière`,
      detail: `${nf(caManquant)} MAD de CA sans recette chiffrée (${sansRecette.slice(0, 3).map((x) => x.d.name).join(", ")}${sansRecette.length > 3 ? "…" : ""}) : ton food cost réel est plus haut qu'affiché. Complète les recettes ou les coûts des matières.`,
    });
  }

  /* 4. matières « à vérifier » parmi les plus grosses consommations */
  const conso = computeForSales(byId, comb);
  const topConso = Object.keys(conso.mp)
    .map((id) => ({ m: byId[id], val: conso.mp[id] * num((byId[id] || {}).cost) }))
    .filter((x) => x.m).sort((a, b) => b.val - a.val).slice(0, 15);
  const flagsTop = topConso.filter((x) => x.m.verif);
  if (flagsTop.length) {
    alertes.push({
      cle: "flagstop:" + flagsTop.map((x) => x.m.id).sort().join(","),
      niveau: "attention",
      titre: `${flagsTop.length} grosse(s) consommation(s) au prix « à vérifier »`,
      detail: flagsTop.slice(0, 4).map((x) => `${x.m.name} (${nf(x.val)} MAD consommés)`).join(" · ") + ". Tant que ces prix ne sont pas confirmés, le food cost est incertain — onglet Économat, filtre ⚠.",
    });
  }

  /* 5. journées anormales (au moins 7 jours importés) */
  const jours = daysInRange();
  if (jours.length >= 7) {
    const stats = jours.map((j) => {
      let rev = 0, cost = 0;
      S.pos.forEach((P) => { const r = computeForSales(byId, (S.salesByDay[j] || {})[P.id] || {}); rev += r.revenue; cost += r.cost; });
      return { j, rev, fc: rev > 0 ? cost / rev * 100 : null };
    });
    const fcs = stats.filter((x) => x.fc != null).map((x) => x.fc);
    if (fcs.length >= 7) {
      const moy = fcs.reduce((a, b) => a + b, 0) / fcs.length;
      const ec = Math.sqrt(fcs.reduce((a, b) => a + (b - moy) * (b - moy), 0) / fcs.length);
      stats.filter((x) => x.fc != null && x.fc > moy + Math.max(2 * ec, 5) && x.fc > S.objectifFC)
        .slice(-3).forEach((x) => {
          alertes.push({
            cle: "jourfc:" + x.j,
            niveau: "attention",
            titre: `Food cost anormal le ${fmtD(x.j)} : ${nf1(x.fc)} %`,
            detail: `La moyenne de la période est de ${nf1(moy)} %. Grosse casse, erreur de saisie ou vol ce jour-là ? Vois le détail par jour de chaque adresse.`,
          });
        });
      const revs = stats.map((x) => x.rev).filter((r) => r > 0).sort((a, b) => a - b);
      if (revs.length >= 7) {
        const mediane = revs[Math.floor(revs.length / 2)];
        stats.filter((x) => x.rev > 0 && x.rev < mediane * 0.4).slice(-2).forEach((x) => {
          alertes.push({
            cle: "jourca:" + x.j,
            niveau: "info",
            titre: `CA très bas le ${fmtD(x.j)} : ${nf(x.rev)} MAD`,
            detail: `Moins de 40 % de la médiane (${nf(mediane)} MAD). Journée fermée, import incomplet ou vraie mauvaise journée ?`,
          });
        });
      }

    const presents = new Set(jours);
    const manquants = [];
    if (S.dateFrom && S.dateTo) {
      const d0 = new Date(S.dateFrom + "T12:00:00"), d1 = new Date(S.dateTo + "T12:00:00");
      for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) {
        const cle = fmtLocalD(d);
        if (!presents.has(cle)) manquants.push(cle);
      }
    }
    if (manquants.length && manquants.length <= 10) {
      alertes.push({
        cle: "trous:" + manquants.join(","),
        niveau: "info",
        titre: `${manquants.length} jour(s) sans ventes dans la période`,
        detail: manquants.map(fmtD).join(", ") + ". Fermeture, ou fichier de caisse pas encore importé ?",
      });
    }
  }

  /* 6. écarts labo (reçu vs vendu) */
  const pats = S.produits.filter((d) => d.fabrique);
  if (pats.length) {
    S.pos.forEach((P) => {
      const v = pats.reduce((a, x) => a + (num((S.recu[P.id] || {})[x.id]) - num((eff[P.id] || {})[x.id])) * unitCost(byId, x.id), 0);
      if (v > 100) {
        alertes.push({
          cle: "labo:" + P.id + ":" + Math.round(v / 50),
          niveau: "attention",
          titre: `Écart labo de ${nf(v)} MAD à ${P.name}`,
          detail: "Le labo a envoyé plus que ce qui a été vendu : invendus, casse ou perte au comptoir. Détail dans Carte → Labo.",
        });
      }
    });
  }

  /* 7. écart économat théorique vs réel */
  if (S.cmpEco) {
    const rows = Object.keys(conso.mp).map((id) => ({ m: byId[id], qty: conso.mp[id] })).filter((r) => r.m);
    const ecart = rows.reduce((s, r) => s + (num(S.reel[r.m.id]) - r.qty) * num(r.m.cost), 0);
    if (conso.cost > 0 && ecart > Math.max(conso.cost * 0.05, 100)) {
      alertes.push({
        cle: "eco:" + Math.round(ecart / 50),
        niveau: "grave",
        titre: `Consommation réelle : +${nf(ecart)} MAD au-dessus des fiches`,
        detail: `Plus de ${nf1(ecart / conso.cost * 100)} % d'écart avec la théorie : pertes, vol, sur-portions ou fiches fausses. Détail dans l'onglet Économat.`,
      });
    }
  }

  /* 8. produits de caisse en attente + associations automatiques sûres */
  S.pos.forEach((P) => {
    const noms = Object.keys(S.pendingRows[P.id] || {});
    if (!noms.length) return;
    const sugg = [];
    noms.forEach((nm2) => {
      const s2 = suggererAssociation(nm2, S.produits);
      if (s2) sugg.push({ nom: nm2, produit: s2.produit });
    });
    alertes.push({
      cle: "attente:" + P.id + ":" + noms.length,
      niveau: "info",
      titre: `${noms.length} produit(s) de caisse à associer (${P.name})`,
      detail: sugg.length
        ? `Le veilleur reconnaît ${sugg.length} nom(s) proche(s) : ${sugg.slice(0, 3).map((x) => `« ${x.nom} » → ${x.produit.name}`).join(" · ")}${sugg.length > 3 ? "…" : ""}.`
        : "Leurs ventes ne comptent pas tant qu'ils ne sont pas associés — onglet Ventes (" + P.name + ").",
      actions: sugg.length ? [{ label: sugg.length > 1 ? `Associer les ${sugg.length} automatiquement` : "Associer automatiquement", act: "veille-assoc", pos: P.id }] : [],
    });
  });

  /* 9. liaison caisse silencieuse : le pont est peut-être fermé ou l'export Elyx arrêté */
  if (S.liaison) {
    const ref = Math.max(num(S.liaison.dernierRecu), num(S.liaison.creele));
    const heures = ref ? (Date.now() - ref) / 3600000 : 0;

        cle: "liaison:" + (dejaRecu ? "silence:" + joursSil : "vide:" + joursSil),
        niveau: "attention",
        titre: dejaRecu ? `La caisse n'a rien envoyé depuis ${joursSil} jours` : "La liaison caisse n'a encore rien reçu",
        detail: dejaRecu
          ? "Le pont Elyx est peut-être fermé sur le PC de la caisse, ou le dossier d'export a changé. Vérifie que la page pont-elyx est ouverte et que l'export programmé d'Elyx tourne toujours."

      });
    }
  }

  return alertes;
}

function parseCSV(text) {
  text = String(text || "");
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const firstLine = (text.match(/^[^\r\n]*/) || [""])[0];
  let delim = ",";
  let best = -1;
  [";", ",", "\t"].forEach((d) => {
    let cnt = 0, inQ = false;
    for (let i = 0; i < firstLine.length; i++) {
      const c = firstLine[i];
      if (c === '"') inQ = !inQ;
      else if (c === d && !inQ) cnt++;
    }
    if (cnt > best) { best = cnt; delim = d; }
  });
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); if (row.length > 1 || row[0] !== "") rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map((hh, i) => String(hh || "").trim() || ("COL" + (i + 1)));
  return rows.slice(1).map((r) => { const o = {}; head.forEach((hh, i) => { o[hh] = r[i] !== undefined ? r[i] : ""; }); return o; });
}

    const src = grid[r]; if (!src) continue;

}

  try {
    const raw = localStorage.getItem(CLE);
    if (raw) { const d = JSON.parse(raw); S = Object.assign(etatVierge(), d); }
  } catch (e) { stockageOK = false; }
  assainirEtat();
}
function assainirEtat() {
  /* un instantané corrompu ne doit jamais empêcher l'app de démarrer */
  const objetValide = (x) => x && typeof x === "object" && !Array.isArray(x);
  S.matieres = (Array.isArray(S.matieres) ? S.matieres : []).filter(objetValide);
  S.produits = (Array.isArray(S.produits) ? S.produits : []).filter(objetValide);
  S.produits.forEach((p) => { p.recipe = (Array.isArray(p.recipe) ? p.recipe : []).filter(objetValide); });
  S.pos = (Array.isArray(S.pos) ? S.pos : []).filter((x) => objetValide(x) && x.id);
  if (!S.pos.length) S.pos = DEFAULT_POS.map((p) => ({ ...p }));
  ["sales", "recu", "reel", "salesByDay", "nameMap", "pendingRows", "veilleVu"].forEach((k) => {
    if (!S[k] || typeof S[k] !== "object" || Array.isArray(S[k])) S[k] = {};

  if (S.liaison && (typeof S.liaison !== "object" || Array.isArray(S.liaison) || !S.liaison.code)) S.liaison = null;

  if (!(num(S.objectifFC) > 0 && num(S.objectifFC) < 100)) S.objectifFC = 30;

function toast(msg, undoFn) {

/* ---------- dérivés (calculés à la demande) ---------- */
const getById = () => { const m = {}; S.matieres.forEach((p) => (m[p.id] = p)); S.produits.forEach((p) => (m[p.id] = p)); return m; };
const hasImport = () => Object.keys(S.salesByDay).length > 0;
const daysInRange = () => Object.keys(S.salesByDay).sort().filter((d) => (!S.dateFrom || d >= S.dateFrom) && (!S.dateTo || d <= S.dateTo));
function rangeSales() {
  const out = {};
  daysInRange().forEach((d) => {
    const day = S.salesByDay[d] || {};
    Object.keys(day).forEach((pId) => {
      out[pId] = out[pId] || {};
      const m = day[pId];
      Object.keys(m).forEach((k) => { out[pId][k] = num(out[pId][k]) + num(m[k]); });
    });
  });
  return out;
}
const effSales = () => hasImport() ? rangeSales() : S.sales;
function combined() {
  const acc = {}, eff = effSales();
  S.pos.forEach((P) => { const sm = eff[P.id] || {}; Object.keys(sm).forEach((k) => { acc[k] = (acc[k] || 0) + num(sm[k]); }); });
  return acc;
}
function periodLabel() {
  if (S.dateFrom && S.dateTo) return S.dateFrom === S.dateTo ? `Le ${fmtD(S.dateFrom)}` : `Du ${fmtD(S.dateFrom)} au ${fmtD(S.dateTo)}`;
  return S.period || "";
}
function setRange(kind) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let a = new Date(t), b = new Date(t);
  if (kind === "week") { const dow = (t.getDay() + 6) % 7; a.setDate(t.getDate() - dow); b = new Date(a); b.setDate(a.getDate() + 6); }
  else if (kind === "month") { a = new Date(t.getFullYear(), t.getMonth(), 1); b = new Date(t.getFullYear(), t.getMonth() + 1, 0); }
  S.dateFrom = fmtLocalD(a); S.dateTo = fmtLocalD(b); save();
}
const catOf = (d) => d.cat || "Autres";
function groupByCat(list) {
  const g = Object.create(null); /* une catégorie « constructor » ne doit pas hériter du prototype */
  list.forEach((d) => { const c = catOf(d); (g[c] = g[c] || []).push(d); });
  return Object.keys(g).sort((a, b) => (a === "Autres") - (b === "Autres") || a.localeCompare(b, "fr")).map((c) => [c, g[c]]);
}

/* ---------- graphiques SVG ---------- */
/* Couleurs de série par adresse — palette validée (dataviz) : bleu, safran, prune, sauge */
const POSC = ["#1F6FB2", "#C2570F", "#6B5CA5", "#3F7F63"];
const couleurPos = (i) => POSC[i % POSC.length];
const CH = { W: 720, H: 210, HL: 130, padL: 46, padR: 12, padT: 12, padB: 24 };
/* Largeur réelle du conteneur → le texte des axes garde sa taille native sur iPhone */
function majLargeurChart() {
  const el = $("vue");
  const w = el && el.clientWidth ? el.clientWidth : 720;
  CH.W = Math.max(320, Math.min(720, w - 38));
}
function pasPropre(maxV, n) {
  const brut = maxV / Math.max(1, n);
  const p = Math.pow(10, Math.floor(Math.log10(brut || 1)));
  for (const m of [1, 2, 5, 10]) { if (m * p >= brut) return m * p; }
  return 10 * p;
}
function axeY(maxV, n, plotH, padT, fmt) {
  const step = pasPropre(maxV, n);
  let out = "", top = step * n;
  for (let v = 0; v <= top; v += step) {
    const y = padT + plotH - (v / top) * plotH;
    out += `<line class="gridl" x1="${CH.padL}" x2="${CH.W - CH.padR}" y1="${y}" y2="${y}"></line>`;
    out += `<text class="axis" x="${CH.padL - 6}" y="${y + 3.5}" text-anchor="end">${fmt ? fmt(v) : nf(v)}</text>`;
  }
  return { svg: out, top };
}
function labelsX(days, plotW, slot) {
  const chaque = Math.max(1, Math.ceil(days.length / Math.max(1, Math.floor(plotW / 52))));
  let out = "";
  days.forEach((d, i) => {
    const dernier = i === days.length - 1;
    if (!dernier && (i % chaque !== 0 || days.length - 1 - i < chaque)) return;
    const x = CH.padL + i * slot + slot / 2;
    out += `<text class="axis" x="${x}" y="${CH.padT + (CH.H - CH.padT - CH.padB) + 15}" text-anchor="middle">${esc(d.slice(8) + "/" + d.slice(5, 7))}</text>`;
  });
  return out;
}
/* CA par jour : barres empilées par adresse (un seul axe) */
function svgCAJour(days, parJour) {
  const plotW = CH.W - CH.padL - CH.padR, plotH = CH.H - CH.padT - CH.padB;
  const slot = plotW / Math.max(1, days.length);
  const bw = Math.min(24, Math.max(3, slot - 4));
  const maxV = Math.max(1, ...days.map((d) => S.pos.reduce((s, P) => s + (parJour[d][P.id] || { revenue: 0 }).revenue, 0)));
  const ax = axeY(maxV, 4, plotH, CH.padT, (v) => v >= 1000 ? nf(v / 1000) + " k" : nf(v));
  const barre = (x, y, w, h, r) => { /* coins arrondis en tête seulement, base carrée */
    if (h <= r + 1) r = Math.max(0, h - 1);
    return `<path d="M${x.toFixed(1)} ${(y + h).toFixed(1)} v${(-(h - r)).toFixed(1)} q0 ${-r} ${r} ${-r} h${(w - 2 * r).toFixed(1)} q${r} 0 ${r} ${r} v${(h - r).toFixed(1)} z"`;
  };
  let bars = "", hits = "";
  days.forEach((d, i) => {
    const x = CH.padL + i * slot + (slot - bw) / 2;
    let base = CH.padT + plotH;
    const parts = S.pos.map((P, pi) => ({ pi, rev: (parJour[d][P.id] || { revenue: 0 }).revenue })).filter((p) => p.rev > 0);
    parts.forEach((p, k) => {
      const hpx = Math.max(1.5, (p.rev / ax.top) * plotH);
      const dernier = k === parts.length - 1;
      const y = base - hpx;
      bars += barre(x, y, bw, hpx, dernier ? 4 : 0) + ` fill="${couleurPos(p.pi)}"></path>`;
      base = y - 2; /* écart de 2 px couleur surface entre segments empilés */
    });
    hits += `<rect class="hitcol" data-day="${esc(d)}" x="${(CH.padL + i * slot).toFixed(1)}" y="${CH.padT}" width="${slot.toFixed(1)}" height="${plotH}" fill="transparent"></rect>`;
  });
  return `<svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label="Chiffre d'affaires par jour">${ax.svg}${bars}${labelsX(days, plotW, slot)}${hits}</svg>`;
}
/* Food cost % par jour : ligne (graphique séparé, même axe X) */
function svgFCJour(days, parJour) {
  const plotW = CH.W - CH.padL - CH.padR, plotH = CH.HL - CH.padT - 24;
  const slot = plotW / Math.max(1, days.length);
  const vals = days.map((d) => {
    let rev = 0, cost = 0;
    S.pos.forEach((P) => { const r = parJour[d][P.id]; if (r) { rev += r.revenue; cost += r.cost; } });
    return rev > 0 ? (cost / rev) * 100 : null;
  });
  const maxV = Math.max(S.objectifFC * 1.25, ...vals.filter((v) => v != null), 10);
  const step = pasPropre(maxV, 3);
  const top = step * 3;
  let grid = "";
  for (let v = 0; v <= top; v += step) {
    const y = CH.padT + plotH - (v / top) * plotH;
    grid += `<line class="gridl" x1="${CH.padL}" x2="${CH.W - CH.padR}" y1="${y}" y2="${y}"></line>` +
      `<text class="axis" x="${CH.padL - 6}" y="${y + 3.5}" text-anchor="end">${nf(v)} %</text>`;
  }
  const pts = [];
  vals.forEach((v, i) => { if (v != null) pts.push([CH.padL + i * slot + slot / 2, CH.padT + plotH - (Math.min(v, top) / top) * plotH, v]); });
  let path = "";
  pts.forEach((p, i) => { path += (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1) + " "; });
  const yObj = CH.padT + plotH - (Math.min(S.objectifFC, top) / top) * plotH;
  const objectif = `<line x1="${CH.padL}" x2="${CH.W - CH.padR}" y1="${yObj}" y2="${yObj}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"></line>` +
    `<text class="axis" x="${CH.W - CH.padR}" y="${yObj - 5}" text-anchor="end" fill="var(--red)">Objectif ${nf(S.objectifFC)} %</text>`;
  let dots = "";
  if (pts.length && pts.length <= 40) pts.forEach((p) => { dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--ink)" stroke="var(--card)" stroke-width="2"></circle>`; });
  else if (pts.length) { const p = pts[pts.length - 1]; dots = `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--ink)" stroke="var(--card)" stroke-width="2"></circle>`; }
  let hits = "";
  days.forEach((d, i) => { hits += `<rect class="hitcol" data-day="${esc(d)}" x="${(CH.padL + i * slot).toFixed(1)}" y="${CH.padT}" width="${slot.toFixed(1)}" height="${plotH}" fill="transparent"></rect>`; });
  return `<svg viewBox="0 0 ${CH.W} ${CH.HL}" role="img" aria-label="Food cost par jour">${grid}${objectif}<path d="${path.trim()}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>${dots}${labelsX(days, plotW, slot)}${hits}</svg>`;
}
/* Matrice menu engineering : popularité (x) × marge unitaire (y) */
function svgMenuEng(me) {
  const W = CH.W, H = 300, padL = 52, padR = 14, padT = 18, padB = 30;
  const etroit = W < 560;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxPop = Math.max(...me.rows.map((r) => r.q)) * 1.12;
  const maxCM = Math.max(...me.rows.map((r) => r.cm), 1) * 1.15;
  const minCM = Math.min(0, ...me.rows.map((r) => r.cm));
  const px = (q) => padL + (q / maxPop) * plotW;
  const py = (cm) => padT + plotH - ((cm - minCM) / (maxCM - minCM)) * plotH;
  const xSeuil = px(me.seuilPop), ySeuil = py(me.avgCM);
  let out = `<rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="var(--panel)" opacity=".45" rx="8"></rect>`;
  out += `<line x1="${xSeuil}" x2="${xSeuil}" y1="${padT}" y2="${padT + plotH}" class="gridl" stroke-width="1.5"></line>`;
  out += `<line x1="${padL}" x2="${padL + plotW}" y1="${ySeuil}" y2="${ySeuil}" class="gridl" stroke-width="1.5"></line>`;
  out += `<text class="axis" x="${padL + 6}" y="${padT + 13}">${etroit ? "Énigmes" : "Énigmes — rentables, peu vendus"}</text>`;
  out += `<text class="axis" x="${padL + plotW - 6}" y="${padT + 13}" text-anchor="end">${etroit ? "Étoiles" : "Étoiles — à mettre en avant"}</text>`;
  out += `<text class="axis" x="${padL + 6}" y="${padT + plotH - 7}">Poids morts</text>`;
  out += `<text class="axis" x="${padL + plotW - 6}" y="${padT + plotH - 7}" text-anchor="end">${etroit ? "Chevaux" : "Chevaux de labour"}</text>`;
  out += `<text class="axis" x="${(padL + plotW / 2).toFixed(0)}" y="${H - 6}" text-anchor="middle">Quantité vendue →</text>`;
  out += `<text class="axis" transform="translate(14 ${(padT + plotH / 2).toFixed(0)}) rotate(-90)" text-anchor="middle">Marge / unité (MAD) →</text>`;
  const tops = me.rows.slice(0, etroit ? 2 : 4).map((r) => r.d.id);
  const poses = []; /* anti-collision : on saute une étiquette trop proche d'une déjà posée */
  let etiquettes = "";
  me.rows.forEach((r) => {
    const x = px(r.q), y = py(r.cm);
    out += `<circle class="medotc" data-pid="${esc(r.d.id)}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="var(--saf)" stroke="var(--card)" stroke-width="2"></circle>`;
    if (tops.includes(r.d.id)) {
      const libre = poses.every((p) => Math.abs(p[0] - x) > plotW * 0.28 || Math.abs(p[1] - y) > 16);
      if (libre) {
        poses.push([x, y]);
        const anchor = x > padL + plotW * 0.6 ? "end" : "start";
        const dx = anchor === "end" ? -9 : 9;
        etiquettes += `<text class="axis" x="${(x + dx).toFixed(1)}" y="${(y - 8).toFixed(1)}" text-anchor="${anchor}" fill="var(--ink)">${esc(r.d.name)}</text>`;
      }
    }
  });
  out += etiquettes; /* les étiquettes passent au-dessus des points */
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Matrice menu engineering">${out}</svg>`;
}

      ${pr > 0 ? `<div><span class="l">Prix de vente</span><br><span class="v">${nf(pr)} MAD</span></div>
      <div><span class="l">Marge brute</span><br><span class="v">${nf(pr - uc)} MAD</span></div>

function imprimer(html) {

    return;
  }
  const z = $("print-zone"); if (!z) return;
  z.innerHTML = html;
  document.body.classList.add("printing");
  const fin = () => { document.body.classList.remove("printing"); };
  if (typeof window.print === "function") {
    if (window.addEventListener) window.addEventListener("afterprint", fin, { once: true });
    if (window.matchMedia) {

      const h = (e) => { if (!e.matches) fin(); };
      if (mq.addEventListener) mq.addEventListener("change", h); else if (mq.addListener) mq.addListener(h);
    }
    setTimeout(() => { window.print(); }, 30);
  } else fin();
}

function majFoot(pid) {

  const uc = unitCost(byId, d.id), pr = num(d.prix), fc = pr ? (uc / pr) * 100 : 0;

function dependants(id, acc) {
  /* produits (visibles ou non) dont le coût dépend de id, récursivement */
  S.produits.forEach((p) => {
    if (acc.has(p.id)) return;
    if ((p.recipe || []).some((l) => l.ref === id)) { acc.add(p.id); dependants(p.id, acc); }
  });
  return acc;
}

const CLE_API = "ecoPro:cle-api";
let copiloteBusy = false, copiloteErreur = "";
function lireCleApi() { try { return localStorage.getItem(CLE_API) || ""; } catch (e) { return ""; } }

function construireDigest() {
  const byId = getById(), eff = effSales(), comb = combined();
  const g = computeForSales(byId, comb);

  const alertes = analyserVeille();
  const conso = Object.keys(g.mp).map((id) => ({ m: byId[id], val: g.mp[id] * num((byId[id] || {}).cost) }))
    .filter((x) => x.m).sort((a, b) => b.val - a.val).slice(0, 10);
  return {
    periode: periodLabel() || "toutes les ventes saisies",
    objectif_food_cost_pct: S.objectifFC,
    global: { ca_mad: Math.round(g.revenue), cout_matiere_mad: Math.round(g.cost), food_cost_pct: Math.round(g.foodCost * 10) / 10 },
    par_adresse: S.pos.map((P) => { const r = computeForSales(byId, eff[P.id] || {}); return { nom: P.name, ca_mad: Math.round(r.revenue), food_cost_pct: Math.round(r.foodCost * 10) / 10 }; }),
    top_marge: me.rows.slice(0, 10).map((r) => ({ produit: r.d.name, vendus: r.q, marge_unitaire_mad: Math.round(r.cm * 100) / 100, food_cost_pct: Math.round(r.fc * 10) / 10, classe: r.cl })),
    pires_food_cost: me.rows.filter((r) => r.uc > 0).sort((a, b) => b.fc - a.fc).slice(0, 8).map((r) => ({ produit: r.d.name, vendus: r.q, food_cost_pct: Math.round(r.fc * 10) / 10 })),
    menu_engineering: { etoiles: me.rows.filter((r) => r.cl === "etoile").length, chevaux: me.rows.filter((r) => r.cl === "cheval").length, enigmes: me.rows.filter((r) => r.cl === "enigme").length, poids_morts: me.rows.filter((r) => r.cl === "poids").length },
    top_consommations: conso.map((x) => ({ matiere: x.m.name, valeur_mad: Math.round(x.val), prix_a_verifier: !!x.m.verif })),
    alertes_du_veilleur: alertes.map((a) => ({ niveau: a.niveau, titre: a.titre })),
  };
}
const SYSTEME_COPILOTE = "Tu es le copilote food cost de Yassine, qui tient deux restaurants à Tanger : La Vue (café-restaurant) et Rare (brunch-restaurant). Tu reçois un résumé chiffré de sa période (montants en dirhams MAD). Réponds en français, tutoie-le, et sois directement actionnable : commence par un diagnostic global en 2 ou 3 phrases, puis 3 à 6 recommandations concrètes en liste à puces (les plus rentables d'abord), en citant les produits et les chiffres du résumé. N'invente aucune donnée : si quelque chose manque pour conclure, dis-le en une phrase. Pas de titres, pas de tableau, maximum 250 mots.";
async function copiloteAnalyser() {
  const cle = lireCleApi();
  if (!cle || copiloteBusy) return;
  copiloteBusy = true; copiloteErreur = ""; render();
  try {
    const rep = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": cle,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "anthropic-beta": "server-side-fallback-2026-07-01",
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        max_tokens: 2048,
        fallbacks: "default",
        system: SYSTEME_COPILOTE,
        messages: [{ role: "user", content: "Voici le résumé de la période :\n" + JSON.stringify(construireDigest()) }],
      }),
    });
    if (rep.status === 401) throw new Error("clé API refusée — vérifie-la dans les Réglages.");
    if (rep.status === 429) throw new Error("trop de demandes d'un coup — réessaie dans une minute.");
    if (!rep.ok) throw new Error("réponse " + rep.status + " de l'API.");
    const data = await rep.json();
    if (data.stop_reason === "refusal") throw new Error("l'analyse a été refusée par les garde-fous du modèle — réessaie.");
    const texte = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
    if (!texte) throw new Error("réponse vide.");
    S.copilote = { texte, date: fmtLocalD(new Date()), periode: periodLabel() || "" };
    save();
  } catch (e) {
    copiloteErreur = String((e && e.message) || e);
    if (/fetch|network|Failed/i.test(copiloteErreur)) copiloteErreur = "impossible de joindre l'API (hors ligne, ou blocage réseau).";
  }
  copiloteBusy = false;
  /* même garde que la synchro liaison : ne jamais re-rendre pendant qu'on tape ailleurs
     (le résultat est dans S.copilote, il s'affichera au prochain passage sur Alertes) */
  if (!saisieEnCours()) render();
}
/* rendu simple du texte du copilote (paragraphes, puces, gras) */
function rendreTexte(t) {
  const lignes = esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").split("\n");
  let html = "", enListe = false;
  lignes.forEach((l) => {
    const lt = l.trim();
    if (/^[-•*] /.test(lt)) {
      if (!enListe) { html += "<ul>"; enListe = true; }
      html += "<li>" + lt.replace(/^[-•*] /, "") + "</li>";
    } else {
      if (enListe) { html += "</ul>"; enListe = false; }
      if (lt) html += "<p>" + lt + "</p>";
    }
  });
  if (enListe) html += "</ul>";
  return html;
}

function carteConsoHTML() {

    <div class="scroll"><table class="tbl">
      <thead><tr><th>Matière</th><th class="r">Théorique</th>${S.cmpEco ? `<th class="r" style="width:100px">Réel</th><th class="r">Écart</th>` : ""}<th class="r">Coût (MAD)</th></tr></thead>
      <tbody>${mpRows.map((r) => {
        const rq = num(S.reel[r.m.id]), diff = rq - r.qty;
        return `<tr><td>${esc(r.m.name)}</td>
          <td class="r">${nf(r.qty)} <span class="tag">${esc(r.m.unit)}</span></td>
          ${S.cmpEco ? `<td class="r"><input class="fld r" style="width:90px" inputmode="decimal" value="${esc(S.reel[r.m.id] || "")}" placeholder="0" data-in="reel" data-id="${esc(r.m.id)}" data-qty="${r.qty}" data-cost="${num(r.m.cost)}" data-unit="${esc(r.m.unit)}"></td>
          <td class="r" id="ecart-${esc(r.m.id)}">${rq ? `<span class="badge ${diff > 0.0001 ? "b-bad" : "b-good"}">${diff > 0 ? "+" : ""}${nf(diff)} ${esc(r.m.unit)}</span>` : `<span class="tag">—</span>`}</td>` : ""}
          <td class="r">${nf(r.cost)}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
    ${S.cmpEco ? `<div class="foot" style="border-top:1px solid var(--line)">

      <div style="align-self:center"><span class="tag">Écart positif = consommé plus que les fiches (pertes, vol, sur-portions, erreurs).</span></div>
    </div>` : ""}`}
  </div>`;
}

/* ---------- labo ---------- */
function productionHTML() {
  const byId = getById();
  const comb = combined();
  const acc = {}; Object.keys(comb).forEach((id) => prodCounts(byId, id, num(comb[id]), acc, []));
  const production = Object.keys(acc).map((id) => ({ p: byId[id], qty: acc[id], uCost: unitCost(byId, id) }))
    .filter((r) => r.p).sort((a, b) => b.qty - a.qty);
  if (!production.length) return "";
  return `<div class="card" id="carte-production">
    <h2 class="h">Production — combien produire</h2>
    <p class="sub">Quantités à produire pour couvrir les ventes des deux adresses sur la période.</p>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Pâtisserie</th><th class="r">À produire</th><th class="r">Coût / pièce</th><th class="r">Coût total (MAD)</th></tr></thead>
      <tbody>${production.map((r) => `<tr><td>${esc(r.p.name)}</td><td class="r">${nf(r.qty)}</td><td class="r">${nf(r.uCost)}</td><td class="r">${nf(r.qty * r.uCost)}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

async function importSales(file, posId) {
  if (!file) return;
  importBusy = true; importInfo = null; render();
  try {
    let rows = [];
    const nm = (file.name || "").toLowerCase();
    if (nm.endsWith(".csv") || file.type === "text/csv") {
      const buf = await file.arrayBuffer();
      let texte = new TextDecoder().decode(buf);
      /* export Excel FR fréquent en Windows-1252 : repli si l'UTF-8 a produit des caractères de remplacement */
      if (texte.includes(String.fromCharCode(0xFFFD))) { try { texte = new TextDecoder("windows-1252").decode(buf); } catch (e) {} }
      rows = parseCSV(texte);
    } else {
      if (typeof DecompressionStream === "undefined") throw new Error("Ce navigateur ne sait pas lire les .xlsx — exporte le fichier en CSV depuis la caisse.");
      rows = await lireXlsx(await file.arrayBuffer());
    }
    if (!rows || !rows.length) { importInfo = { error: "Fichier vide ou illisible." }; importBusy = false; render(); return; }
    const keys = Object.keys(rows[0]);
    const cDate = pickCol(keys, ["date", "jour", "datetime"]);
    const cTime = pickCol(keys, ["heure", "time"]);
    const cProd = pickCol(keys, ["produit", "designation", "article", "libell", "name", "item"]);
    const cQty = pickCol(keys, ["quantite", "qte", "qty", "quant", "vendu", "nombre"]);
    if (!cDate || !cProd || !cQty) {
      importInfo = { error: "Colonnes non reconnues. Colonnes du fichier : " + keys.join(", ") + ". Il faut au minimum une date, un produit et une quantité." };
      importBusy = false; render(); return;
    }
    const byId = getById();
    const prodByName = Object.create(null); S.produits.forEach((p) => { if (p.name) prodByName[normN(p.name)] = p.id; });
    const map = {}; const known = new Set(); const unknown = Object.create(null); const pend = Object.create(null); let lines = 0;
    rows.forEach((row) => {
      const dt = parseDT(row[cDate], cTime ? row[cTime] : null); if (!dt) return;
      const pname = String(row[cProd] || "").trim(); if (!pname) return;
      const qty = num(row[cQty]); if (!qty) return;
      lines++;
      const day = bizDayKey(dt);
      /* lookups gardés : un nom de produit « constructor » ou « __proto__ » ne doit pas remonter le prototype */
      const mapped = Object.prototype.hasOwnProperty.call(S.nameMap, normN(pname)) ? S.nameMap[normN(pname)] : null;
      const pid = prodByName[normN(pname)] || (mapped && byId[mapped] ? mapped : null);
      if (!pid) {
        unknown[pname] = (unknown[pname] || 0) + qty;
        (pend[pname] = pend[pname] || []).push({ day, qty });
        return;
      }
      known.add(pname);
      map[day] = map[day] || {}; map[day][posId] = map[day][posId] || {};
      map[day][posId][pid] = num(map[day][posId][pid]) + qty;
    });
    const charge = { map, pend, unknown: Object.keys(unknown), lines, matched: known.size, posId };
    /* le veilleur : mêmes jours déjà importés pour cette adresse → risque de doublon */
    const collisions = Object.keys(map).filter((d) => S.salesByDay[d] && S.salesByDay[d][posId] && Object.keys(S.salesByDay[d][posId]).length);
    if (collisions.length) {
      importEnAttente = charge;
      importBusy = false;
      const mt = $("mi-texte");
      if (mt) mt.textContent = `${collisions.length} jour(s) du fichier (${fmtD(collisions[0])}${collisions.length > 1 ? " → " + fmtD(collisions[collisions.length - 1]) : ""}) ont déjà des ventes pour cette adresse. « Remplacer » écrase ces jours par le fichier (le bon choix pour un ré-import) ; « Additionner » cumule les deux (risque de compter double).`;
      const m = $("modal-import"); if (m) m.classList.add("on");
      render();
      return;
    }
    appliquerImport(charge, "additionner");
  } catch (e) { importInfo = { error: String((e && e.message) || e) }; }
  importBusy = false; render();
}
let importEnAttente = null;
function appliquerImport(charge, mode) {
  const { map, pend, posId } = charge;
  if (Object.keys(pend).length) {
    S.pendingRows[posId] = S.pendingRows[posId] || {};
    Object.keys(pend).forEach((nm2) => {
      const avant = Object.prototype.hasOwnProperty.call(S.pendingRows[posId], nm2) ? S.pendingRows[posId][nm2] : [];
      poserCle(S.pendingRows[posId], nm2, [...avant, ...pend[nm2]]);
    });
  }
  Object.keys(map).forEach((day) => {
    S.salesByDay[day] = S.salesByDay[day] || {};
    if (mode === "remplacer") S.salesByDay[day][posId] = {};
    else S.salesByDay[day][posId] = S.salesByDay[day][posId] || {};
    Object.keys(map[day][posId]).forEach((pid) => {
      S.salesByDay[day][posId][pid] = num(S.salesByDay[day][posId][pid]) + num(map[day][posId][pid]);

  const days = Object.keys(map).sort();
  if (days.length) { S.dateFrom = days[0]; S.dateTo = days[days.length - 1]; }
  importInfo = { ok: true, days: days.length, firstDay: days[0] || "", lastDay: days[days.length - 1] || "", lines: charge.lines, matched: charge.matched, unknown: charge.unknown };

/* ---------- liaison caisse (Elyx via Firebase) ---------- */
/* La caisse ne parle pas directement à l'app : le pont (pont-elyx.html, sur le PC de la caisse)
   dépose les ventes agrégées par jour dans Firebase sous economat/{code}, et l'app vient les lire.
   Le code de liaison est le seul secret : long, aléatoire, jamais deviné. */
const LIAISON_BASE = "https://parchissi-35156-default-rtdb.europe-west1.firebasedatabase.app/economat/";
let liaisonBusy = false, liaisonInfo = null;
function genererCodeLiaison() {
  const ALPH = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; /* sans I, L, O, 0 ni 1, trop faciles à confondre */
  const n = ALPH.length, plafond = n * Math.floor(256 / n);
  const tirer = () => {
    if (typeof crypto !== "undefined" && crypto.getRandomValues) {
      const b = new Uint8Array(1);
      do { crypto.getRandomValues(b); } while (b[0] >= plafond); /* échantillonnage par rejet : pas de biais */
      return ALPH[b[0] % n];
    }
    return ALPH[Math.floor(Math.random() * n)];
  };
  const g = () => tirer() + tirer() + tirer() + tirer();
  return g() + "-" + g() + "-" + g() + "-" + g();
}
function retirerPendingJour(posId, day) {
  const pend = S.pendingRows[posId]; if (!pend) return;
  Object.keys(pend).forEach((nm2) => {
    const reste = (Array.isArray(pend[nm2]) ? pend[nm2] : []).filter((e) => e && e.day !== day);
    if (reste.length) poserCle(pend, nm2, reste); else delete pend[nm2];
  });
}
/* applique l'arbre ventes/{posId}/{jour} reçu de Firebase.
   Chaque jour reçu REMPLACE ce que l'app avait pour ce jour et cette adresse (la caisse fait foi),
   et n'est appliqué qu'une fois par horodatage (S.liaison.vus). */
function appliquerVentesLiaison(data) {
  if (!S.liaison || !data || typeof data !== "object") return { jours: 0, inconnus: 0 };
  const byId = getById();
  const prodByName = Object.create(null); S.produits.forEach((p) => { if (p.name) prodByName[normN(p.name)] = p.id; });
  let jours = 0; const inconnus = new Set();
  S.pos.forEach((P) => {
    const noeud = Object.prototype.hasOwnProperty.call(data, P.id) ? data[P.id] : null;
    if (!noeud || typeof noeud !== "object") return;
    Object.keys(noeud).forEach((day) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return;
      const entree = noeud[day];
      if (!entree || typeof entree !== "object" || !Array.isArray(entree.lignes)) return;
      const t = num(entree.t) || 0;
      const cle = P.id + "|" + day;
      const vu = Object.prototype.hasOwnProperty.call(S.liaison.vus, cle) ? num(S.liaison.vus[cle]) : 0;
      if (t && vu >= t) return;
      retirerPendingJour(P.id, day);
      S.salesByDay[day] = S.salesByDay[day] || {};
      S.salesByDay[day][P.id] = {};
      entree.lignes.forEach((l) => {
        if (!l || typeof l !== "object") return;
        const pname = String(l.n || "").trim(); const qty = num(l.q);
        if (!pname || !qty) return;
        const mappe = Object.prototype.hasOwnProperty.call(S.nameMap, normN(pname)) ? S.nameMap[normN(pname)] : null;
        const pid = prodByName[normN(pname)] || (mappe && byId[mappe] ? mappe : null);
        if (!pid) {
          inconnus.add(pname);
          S.pendingRows[P.id] = S.pendingRows[P.id] || {};
          const avant = Object.prototype.hasOwnProperty.call(S.pendingRows[P.id], pname) ? S.pendingRows[P.id][pname] : [];
          poserCle(S.pendingRows[P.id], pname, [...avant, { day, qty }]);
          return;
        }
        S.salesByDay[day][P.id][pid] = num(S.salesByDay[day][P.id][pid]) + qty;
      });
      poserCle(S.liaison.vus, cle, t || Date.now());
      if (!S.dateFrom || day < S.dateFrom) S.dateFrom = day;
      if (!S.dateTo || day > S.dateTo) S.dateTo = day;
      if (t > num(S.liaison.dernierRecu)) S.liaison.dernierRecu = t;
      jours++;
    });
  });
  return { jours, inconnus: inconnus.size };
}
const liaisonURL = (chemin) => LIAISON_BASE + S.liaison.code + chemin + ".json";
async function synchroniserLiaison(silencieux) {
  if (!S.liaison || liaisonBusy || typeof fetch === "undefined") return;
  liaisonBusy = true;
  majLiaisonEtat("Synchronisation…");
  try {
    /* la configuration (liste des adresses) est re-poussée à chaque synchro : le pont la lit */
    const posMap = {}; S.pos.forEach((P) => { posMap[P.id] = P.name || "(adresse)"; });
    const rc = await fetch(liaisonURL("/config"), { method: "PUT", body: JSON.stringify({ v: 1, creele: num(S.liaison.creele) || Date.now(), pos: posMap }) });
    if (rc.status === 401 || rc.status === 403) throw new Error("REGLES");
    if (!rc.ok) throw new Error("HTTP " + rc.status);
    const rv = await fetch(liaisonURL("/ventes"));
    if (rv.status === 401 || rv.status === 403) throw new Error("REGLES");
    if (!rv.ok) throw new Error("HTTP " + rv.status);
    const data = await rv.json();
    const res = appliquerVentesLiaison(data || {});
    S.liaison.dernierSync = Date.now();
    liaisonInfo = { ok: true };
    save();
    if (res.jours) {
      toast(`Caisse synchronisée : ${res.jours} jour(s) mis à jour${res.inconnus ? `, ${res.inconnus} nom(s) à associer` : ""}.`);
      if (saisieEnCours()) majLiaisonEtat(); else render();
    } else {
      if (!silencieux) toast("Caisse synchronisée — rien de nouveau.");
      majLiaisonEtat();
    }
  } catch (e) {
    liaisonInfo = { error: (e && e.message === "REGLES")
      ? "Firebase a refusé l'accès : les règles de la base ne sont pas encore publiées (vois le guide sous le code)."
      : "Synchronisation impossible (hors ligne ?). Nouvelle tentative au prochain passage sur l'app." };
    if (!silencieux) toast("Liaison caisse : " + liaisonInfo.error);
    majLiaisonEtat();
  }
  liaisonBusy = false;
}

function csvCell(v) {

  if (/^[=+\-@]/.test(s)) s = "'" + s; /* pas d'injection de formule à l'ouverture dans Excel */

async function telecharger(nomFichier, contenu, type) {
  const mime = type || "application/octet-stream";
  /* en mode « écran d'accueil » iOS, a.download échoue en silence → feuille de partage (Enregistrer dans Fichiers) */
  const standalone = navigator.standalone === true || !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone && navigator.canShare && typeof File === "function") {
    try {
      const f = new File([contenu], nomFichier, { type: mime });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
  }
  try {
    const blob = new Blob([contenu], { type: mime });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nomFichier;
    a.click();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 4000);
    return true;
  } catch (e) { toast("Téléchargement impossible sur ce navigateur."); return false; }
}

/* ---------- petites mutations ---------- */
const mat = (id) => S.matieres.find((m) => m.id === id);
const prod = (id) => S.produits.find((p) => p.id === id);
const patchM = (id, p) => { const m = mat(id); if (m) Object.assign(m, p); };
const patchP = (id, p) => { const d = prod(id); if (d) Object.assign(d, p); };
function snapshotDonnees() { return JSON.parse(JSON.stringify({ matieres: S.matieres, produits: S.produits, sales: S.sales, recu: S.recu, reel: S.reel })); }
function restaurerDonnees(sn) { const d = JSON.parse(JSON.stringify(sn)); S.matieres = d.matieres; S.produits = d.produits; S.sales = d.sales; S.recu = d.recu; S.reel = d.reel; }

function delMatiere(id) {
  const m = mat(id); if (!m) return;
  const used = S.produits.filter((p) => (p.recipe || []).some((l) => l.ref === id)).length;
  const faire = () => {
    const sn = snapshotDonnees();
    S.matieres = S.matieres.filter((x) => x.id !== id);
    if (used > 0) S.produits.forEach((p) => { p.recipe = (p.recipe || []).filter((l) => l.ref !== id); });
    delete S.reel[id];
    save(); render();
    planUndo(`« ${m.name || "matière"} » supprimée.`, sn, restaurerDonnees);
  };
  if (used > 0) demanderConfirm("Supprimer cette matière ?", `« ${m.name || "(sans nom)"} » est utilisée dans ${used} recette(s). La supprimer la retirera aussi de ces recettes.`, "Supprimer", faire);
  else faire();
}
function delProduit(id) {
  const d = prod(id); if (!d) return;
  const used = S.produits.filter((p) => p.id !== id && (p.recipe || []).some((l) => l.ref === id)).length;
  const faire = () => {
    const sn = snapshotDonnees();
    sn.salesByDay = JSON.parse(JSON.stringify(S.salesByDay)); sn.nameMap = { ...S.nameMap };
    S.produits = S.produits.filter((x) => x.id !== id);
    S.produits.forEach((p) => { p.recipe = (p.recipe || []).filter((l) => l.ref !== id); });
    Object.keys(S.sales).forEach((pid) => { if (S.sales[pid]) delete S.sales[pid][id]; });
    Object.keys(S.recu).forEach((pid) => { if (S.recu[pid]) delete S.recu[pid][id]; });
    /* purge des ventes importées et des correspondances qui pointaient sur ce produit */
    Object.keys(S.salesByDay).forEach((j) => {
      const jour = S.salesByDay[j];
      Object.keys(jour).forEach((pp) => { delete jour[pp][id]; if (!Object.keys(jour[pp]).length) delete jour[pp]; });
      if (!Object.keys(jour).length) delete S.salesByDay[j];
    });
    Object.keys(S.nameMap).forEach((n) => { if (S.nameMap[n] === id) delete S.nameMap[n]; });
    save(); render();
    planUndo(`« ${d.name || "produit"} » supprimé.`, sn, (s2) => {
      restaurerDonnees(s2);
      if (s2.salesByDay) S.salesByDay = JSON.parse(JSON.stringify(s2.salesByDay));
      if (s2.nameMap) S.nameMap = { ...s2.nameMap };
    });
  };
  if (used > 0) demanderConfirm("Supprimer ce produit ?", `« ${d.name || "(sans nom)"} » sert d'ingrédient dans ${used} autre(s) recette(s). Le supprimer l'en retirera.`, "Supprimer", faire);
  else faire();
}
function delPos(id) {
  const P = S.pos.find((x) => x.id === id); if (!P || S.pos.length <= 1) return;
  demanderConfirm("Supprimer cette adresse ?", `« ${P.name} » et ses ventes saisies seront retirées. Les produits et l'économat sont conservés.`, "Supprimer", () => {
    S.pos = S.pos.filter((x) => x.id !== id);
    delete S.sales[id]; delete S.recu[id]; delete S.pendingRows[id];
    Object.keys(S.salesByDay).forEach((j) => {
      delete S.salesByDay[j][id];
      if (!Object.keys(S.salesByDay[j]).length) delete S.salesByDay[j];
    });
    if (posVentes === id) posVentes = "";
    if (sousCarte === id) sousCarte = "";
    save(); render();
  });
}
function togglePos(d, posId) {
  const allIds = S.pos.map((P) => P.id);
  const cur = Array.isArray(d.posIds) && d.posIds.length ? d.posIds : allIds;
  const next = cur.includes(posId) ? cur.filter((x) => x !== posId) : [...cur, posId];
  const isAll = next.length === 0 || allIds.every((x) => next.includes(x));
  d.posIds = isAll ? [] : next;
}

}

function majControle(posId, pid) {

function montrerTtip(cible, html) {
  if (!cible.closest || !cible.getBoundingClientRect) return;
  const wrap = cible.closest(".chartwrap"); if (!wrap) return;
  const tip = wrap.querySelector(".ttip"); if (!tip) return;
  tip.innerHTML = html; tip.style.display = "block";
  const wr = wrap.getBoundingClientRect(), cr = cible.getBoundingClientRect();
  let x = cr.left - wr.left + cr.width / 2;
  tip.style.top = "6px";
  tip.style.left = "0px";
  const tw = tip.offsetWidth || 150;
  x = Math.max(4, Math.min(wr.width - tw - 4, x - tw / 2));
  tip.style.left = x + "px";
}

function nbAlertesVeille() {
  if (nbAlertesCache !== null) return nbAlertesCache;
  try { nbAlertesCache = analyserVeille().filter((a) => !S.veilleVu[a.cle]).length; } catch (e) { nbAlertesCache = 0; }
  return nbAlertesCache;
}
function renderTabs() {
  const bar = $("tabs"); if (!bar) return;
  const nb = nbAlertesVeille();
  const items = [
    ["synthese", "Synthèse", "📊"], ["ventes", "Ventes", "🧾"], ["carte", "Carte", "🍽️"],
    ["economat", "Économat", "🧺"], ["reglages", "Réglages", "⚙️"],
  ];
  /* la pastille reste HORS du span .ico : le filtre de gris des onglets inactifs ne doit pas l'éteindre */
  bar.innerHTML = items.map(([k, l, ico]) => `<button class="tb${tab === k ? " on" : ""}" data-tab="${esc(k)}" aria-label="${esc(l)}"${tab === k ? ` aria-current="page"` : ""}>
    ${k === "synthese" && nb ? `<span class="pastille">${nb}</span>` : ""}<span class="ico">${ico}</span>${esc(l)}</button>`).join("");
}
function render() {
  const vueEl = $("vue"); if (!vueEl) return;
  nbAlertesCache = null;
  majLargeurChart();
  const accueil = !S.entered && !S.matieres.length && !S.produits.length;
  const bar = $("tabs"); if (bar) bar.style.display = accueil ? "none" : "flex";
  const pied = $("pied"); if (pied) pied.style.display = accueil ? "none" : "block";
  if (accueil) { vueEl.innerHTML = vueAccueil(); return; }
  renderTabs();
  if (tab === "ventes") vueEl.innerHTML = vueVentes(posVentesActif());
  else if (tab === "carte") vueEl.innerHTML = vueCarte();
  else if (tab === "economat") vueEl.innerHTML = vueEconomat();
  else if (tab === "reglages") vueEl.innerHTML = vueReglages();
  else {
    tab = "synthese";
    const me = menuEng(getById(), combined(), S.produits);
    meCache = {}; me.rows.forEach((r) => { meCache[r.d.id] = r; });
    vueEl.innerHTML = vueSynthese();
  }
}

/* ---------- démarrage ---------- */
function bindGlobal() {
  const vueEl = $("vue"); if (!vueEl || !vueEl.addEventListener) return;
  vueEl.addEventListener("click", onClick);
  vueEl.addEventListener("input", onInput);
  vueEl.addEventListener("change", onChange);
  vueEl.addEventListener("mouseover", (e) => {
    const t = e.target;
    if (t && t.classList && (t.classList.contains("hitcol") || t.classList.contains("medotc")))
      montrerTtip(t, t.classList.contains("medotc") ? ttipMEHTML(t.dataset.pid) : ttipJourHTML(t.dataset.day));
  });
  vueEl.addEventListener("mouseout", (e) => {
    const t = e.target;
    if (t && t.classList && (t.classList.contains("hitcol") || t.classList.contains("medotc"))) cacherTtips();
  });
  vueEl.addEventListener("toggle", (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.cat !== undefined) openCats[t.dataset.cat] = !!t.open;
  }, true);
  const bar = $("tabs");
  if (bar && bar.addEventListener) bar.addEventListener("click", (e) => {
    const b = e.target && e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!b) return;
    tab = b.dataset.tab; cardQ = ""; importInfo = null;
    render();
    if (typeof window.scrollTo === "function") window.scrollTo(0, 0);
  });
  if (window.addEventListener) window.addEventListener("resize", debounce(() => { if (tab === "synthese") render(); }, 300));
  /* liaison caisse : resynchroniser quand on revient sur l'app (réveil iPhone, changement d'onglet) */
  const resyncLiaison = debounce(() => { if (S.liaison) synchroniserLiaison(true); }, 800);
  if (window.addEventListener) window.addEventListener("focus", resyncLiaison);
  if (document.addEventListener) document.addEventListener("visibilitychange", () => { try { if (document.visibilityState === "visible") resyncLiaison(); } catch (e) {} });
  const lie = (id, fn) => { const el = $(id); if (el && el.addEventListener) el.addEventListener("click", fn); };
  lie("mc-non", fermerModals);
  lie("mc-oui", () => { const cb = confirmCb; fermerModals(); if (cb) cb(); });
  lie("mi-annuler", () => importChoisir(null));
  lie("mi-additionner", () => importChoisir("additionner"));
  lie("mi-remplacer", () => importChoisir("remplacer"));
  const mimp = $("modal-import");
  if (mimp && mimp.addEventListener) mimp.addEventListener("click", (e) => { if (e.target === mimp) importChoisir(null); });
  lie("fiche-fermer", fermerModals);
  lie("fiche-imprimer", () => {
    const d = prod(fichePid);
    if (d) imprimer(`<div class="fiche card">${ficheHTML(d, { date: "Fiche du " + fmtD(fmtLocalD(new Date())) })}</div>`);
  });
  ["modal-confirm", "modal-fiche"].forEach((idm) => {
    const m = $(idm);
    if (m && m.addEventListener) m.addEventListener("click", (e) => { if (e.target === m) fermerModals(); });
  });
}
function boot() {
  chargerEtat();
  if (S.matieres.length || S.produits.length) { S.entered = true; tab = "synthese"; }
  bindGlobal();
  render();
  if (!stockageOK) toast("Stockage local indisponible — pense à exporter une sauvegarde (Réglages).");
  if (S.liaison) synchroniserLiaison(true);
  setInterval(() => { if (S.liaison) synchroniserLiaison(true); }, 5 * 60 * 1000);
}
boot();
